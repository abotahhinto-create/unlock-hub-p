[package]
name = "unlock-hub"
version = "23.1.0"
description = "النظام العربي الشامل لبرمجة الأجهزة - Unlock Hub"
authors = ["Nashwan Al-Badri"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# تحسين حجم وسرعة ملف exe النهائي
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
