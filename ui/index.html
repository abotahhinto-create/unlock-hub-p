<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام برمجة وفك وتعريب شفرات الأجهزة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root { --bg: #0a0e17; --surface: #111827; --surface-light: #1f2937; --border: #2d3748; --primary: #00d4aa; --primary-dark: #00b894; --danger: #e74c3c; --warning: #f39c12; --info: #3498db; --text: #e2e8f0; --text-muted: #94a3b8; --radius: 10px; --shadow: 0 4px 20px rgba(0,0,0,.4); }
[data-theme="light"] { --bg: #f3f4f6; --surface: #ffffff; --surface-light: #f9fafb; --border: #e5e7eb; --primary: #059669; --text: #1f2937; --text-muted: #6b7280; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; transition: background 0.3s; }
.sidebar { width: 260px; background: var(--surface); border-left: 1px solid var(--border); height: 100vh; position: fixed; right: 0; display: flex; flex-direction: column; z-index: 100; }
.sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
.sidebar-logo { width: 50px; height: 50px; background: var(--primary); border-radius: 10px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.sidebar-title { font-size: 15px; font-weight: 800; color: var(--primary); }
.nav-links { flex: 1; overflow-y: auto; padding: 10px 0; }
.nav-btn { width: 100%; padding: 12px 20px; text-align: right; background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; gap: 10px; }
.nav-btn:hover, .nav-btn.active { background: rgba(0,212,170,0.1); color: var(--primary); border-right: 4px solid var(--primary); font-weight: 700; }
.main-wrapper { flex: 1; margin-right: 260px; padding: 20px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: var(--shadow); }
.btn { padding: 10px 20px; border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; color: #fff; background: var(--primary); transition: 0.2s; }
.btn:hover { filter: brightness(1.1); }
.btn-danger { background: var(--danger); }
.btn-warning { background: var(--warning); color: #000; }
.form-control { width: 100%; padding: 10px; background: var(--surface-light); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.page { display: none; }
.page.active { display: block; }
.terminal { background: #000; color: #00ff88; padding: 15px; border-radius: var(--radius); font-family: monospace; height: 250px; overflow-y: auto; direction: ltr; }
</style>
</head>
<body data-theme="dark">

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">🔓</div>
    <div class="sidebar-title">نظام برمجة وفك الشفرات</div>
  </div>
  <div class="nav-links">
    <button class="nav-btn active" onclick="navigate('dashboard',this)">🏠 الرئيسية</button>
    <button class="nav-btn" onclick="navigate('unlock',this)">🔓 فك القفل (FRP)</button>
    <button class="nav-btn" onclick="navigate('localization',this)">🌐 التعريب</button>
    <button class="nav-btn" onclick="navigate('account',this)">👤 حسابي</button>
    <button class="nav-btn" onclick="navigate('admin',this)" id="adminNavBtn" style="display:none; color:var(--danger);">🛡️ لوحة التحكم</button>
    <button class="nav-btn" onclick="navigate('logs',this)">📜 السجل</button>
  </div>
</aside>

<div class="main-wrapper">
  <header class="top-bar">
    <h2 id="statusText">جاري الاتصال...</h2>
    <button class="btn" onclick="setTheme()">تبديل الثيم</button>
  </header>

  <div id="page-dashboard" class="page active">
    <div class="card">
      <h2>مرحباً بك في لوحة التحكم</h2>
      <p>هذه النسخة مخصصة للكمبيوتر وتتصل مباشرة بالهاتف عبر كابل USB.</p>
    </div>
  </div>

  <div id="page-unlock" class="page">
    <div class="card">
      <h2>فك حساب جوجل (FRP)</h2>
      <button class="btn btn-danger" onclick="runCmd('shell content insert --uri content://settings/secure --bind name:s:user_setup_complete --bind value:s:1')">🚀 تنفيذ فك FRP</button>
    </div>
  </div>

  <div id="page-localization" class="page">
    <div class="card">
      <h2>تعريب الجهاز</h2>
      <button class="btn" onclick="runCmd('shell settings put system system_locales ar-SA')">🌐 تعريب إلى العربية</button>
    </div>
  </div>

  <div id="page-account" class="page">
    <div class="card">
      <h2>حسابي</h2>
      <input type="email" id="email" class="form-control" placeholder="البريد الإلكتروني">
      <input type="password" id="password" class="form-control" placeholder="كلمة المرور">
      <button class="btn" onclick="login()">تسجيل الدخول</button>
    </div>
  </div>

  <div id="page-admin" class="page">
    <div class="card">
      <h2>لوحة المشرف</h2>
      <p>مرحباً بك أيها المدير.</p>
    </div>
  </div>

  <div id="page-logs" class="page">
    <div class="card">
      <h2>السجل</h2>
      <div class="terminal" id="terminal"></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCy0tMUMSkc8kncsB5bO3jYzzVQqzsCTC4", authDomain: "unlock-hub-p.firebaseapp.com", databaseURL: "https://unlock-hub-p-default-rtdb.firebaseio.com", projectId: "unlock-hub-p", storageBucket: "unlock-hub-p.firebasestorage.app", messagingSenderId: "582014234037", appId: "1:582014234037:web:69dc35370307a0600bfdfc" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "sgeanashwan@gmail.com";

function navigate(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  btn.classList.add('active');
}

function setTheme() {
  const body = document.body;
  body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

// دالة تنفيذ الأوامر (تربط مع Tauri)
async function runCmd(cmd) {
  addLog(`> adb ${cmd}`);
  if (window.__TAURI__) {
    try {
      const res = await window.__TAURI__.core.invoke('execute_adb', { command: cmd });
      addLog(res.output);
    } catch(e) { addLog('Error: ' + e); }
  } else {
    addLog('[محاكاة] سيتم التنفيذ في نسخة الكمبيوتر.');
  }
}

function addLog(msg) {
  const t = document.getElementById('terminal');
  t.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  t.scrollTop = t.scrollHeight;
}

auth.onAuthStateChanged(user => {
  if(user) {
    document.getElementById('statusText').innerText = user.email;
    if(user.email === ADMIN_EMAIL) document.getElementById('adminNavBtn').style.display = 'block';
  } else {
    document.getElementById('statusText').innerText = 'غير مسجل';
  }
});

async function login() {
  try {
    await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
    alert('تم الدخول');
  } catch(e) { alert(e.message); }
}
</script>
</body>
</html>
